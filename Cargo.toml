[package]
name = "kanso-infer"
version = "0.1.0"
edition = "2024"
description = "A minimalist LLM inference engine in Rust with Paged KV Cache, Continuous Batching, and Metal Shaders"

[lib]
name = "kanso_infer"
path = "src/lib.rs"

[[bin]]
name = "kanso"
path = "src/main.rs"

[[bin]]
name = "bench"
path = "src/bin/bench.rs"

[dependencies]
candle-core = { version = "0.11.0", features = ["metal"] }
candle-nn = { version = "0.11.0", features = ["metal"] }
tokenizers = "0.23.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "signal", "net"] }
tokio-stream = "0.1"
futures-util = { version = "0.3", default-features = false }
axum = "0.8"
clap = { version = "4.6.4", features = ["derive"] }
rand = "0.9"
libc = "0.2"
float8 = "0.7.0"

[target.'cfg(target_os = "macos")'.dependencies]
metal = "0.29"
[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
rand = "0.9"
